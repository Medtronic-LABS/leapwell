name: Release
description: Track a release (maintainers)
title: "[Release] "
labels: ["type:release"]
type: Task
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Do not paste patient or member data, names, phone numbers, IDs, credentials, tokens or unscrubbed logs.
  - type: input
    id: version
    attributes:
      label: Version
      description: For example 1.2.0+16
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Release checklist
      options:
        - label: CI green on the integration branch
        - label: Version bumped
        - label: Training build verified on a device
        - label: Release notes written
        - label: Prod build made from the tagged commit and checksum recorded
