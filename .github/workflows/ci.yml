name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdlc-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests for scripts
        run: python3 -m unittest discover -s scripts -t .

  secret-scan:
    runs-on: ubuntu-latest
    env:
      # gitleaks-action needs a paid GITLEAKS_LICENSE for organisation-owned repos,
      # so the open-source CLI is run directly from a pinned, checksum-verified release.
      GITLEAKS_VERSION: 8.24.3
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE_SHA: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks/$archive" "$base/$archive"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP/gitleaks" && grep " $archive\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/gitleaks/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks

      - name: Scan commits for secrets
        run: |
          zeros="0000000000000000000000000000000000000000"
          base="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          if [ -n "$base" ] && [ "$base" != "$zeros" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            range="$base..$GITHUB_SHA"
            echo "Scanning commit range $range"
            "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --log-opts="$range"
          else
            echo "No usable base commit (manual run, new branch or missing from history); scanning full history"
            "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner
          fi

  lint:
    runs-on: ubuntu-latest
    env:
      RUFF_VERSION: 0.17.3
      SHELLCHECK_PY_VERSION: 0.11.0.1
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@v7

      - name: Install ruff and shellcheck
        run: pip install "ruff==${RUFF_VERSION}" "shellcheck-py==${SHELLCHECK_PY_VERSION}"

      - name: Install actionlint
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -sSfL -o "$RUNNER_TEMP/actionlint/$archive" "$base/$archive"
          curl -sSfL -o "$RUNNER_TEMP/actionlint/checksums.txt" "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP/actionlint" && grep " $archive\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/actionlint/$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      # Same rules as the pre-commit hook (hub_lint_rules in repos.json), over every tracked file.
      - name: Lint Python, shell scripts and workflows
        run: python3 scripts/sdlc/lint_files.py --all

  mockup-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan mockups and wiki text for patient data and secrets
        run: python3 scripts/sdlc/scan_text.py mockups wiki
