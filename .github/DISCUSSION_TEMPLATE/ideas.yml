title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Do not paste patient or member data, names, phone numbers, IDs, credentials, tokens or unscrubbed logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: input
    id: who
    attributes:
      label: Who is affected
      description: SK, supervisor, clinician, admin, partner.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: What have you seen or heard that supports this (no names or patient details)?
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This post contains no patient/member data, names, phone numbers, IDs, credentials, tokens or unscrubbed logs (this repo is public)
          required: true
