# Managed by leapwell (scripts/sync/sync_repos.py). Do not edit here; change it in leapwell and re-sync.
# GitHub only auto-closes issues for merges into the default branch, so this closes
# `Closes #N` issues when a PR merges into the (non-default) integration branch.
name: LW close on merge

on:
  pull_request:
    types: [closed]
    branches: [{{integration_branch}}]

permissions:
  contents: read
  issues: write

jobs:
  lw-close-on-merge:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == '{{integration_branch}}' && github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: {{org}}/{{tracker}}
          ref: {{leapwell_ref}}
          path: .leapwell
          persist-credentials: false

      # The PR body is read from the event file by the script, never interpolated into the shell.
      - name: Close issues referenced with close/fix/resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 .leapwell/scripts/sdlc/close_on_merge.py --event "$GITHUB_EVENT_PATH" --repo "$REPO" --apply
