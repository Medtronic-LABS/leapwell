# Local Frappe bench for the LeapWell Frappe apps. Run it through frappe_setup.sh (needs a .env, see .env.example).
# App source comes from the workspace clones in ../../repos (see /lw-setup); nothing is copied into the image.
services:

  backend:
    build:
      context: ./docker/backend-v16
      dockerfile: Dockerfile
    image: leapwell-frappe-backend:latest
    command: sleep infinity
    restart: unless-stopped
    volumes:
      - ./development/workspace:/home/frappe
      # Workspace clones, mounted outside the bench tree so `bench init` never meets a pre-existing
      # frappe-bench/apps. frappe_setup.sh links them into frappe-bench/apps/.
      - ../../repos/frappe_spice_next_core:/workspace-apps/spice_next_core
      - ../../repos/leapwell_shukhee_integration:/workspace-apps/shukhee_integration
      - ../../repos/frappe_card_studio:/workspace-apps/card_studio
      - ../../repos/frappe_leapwell_telemetry:/workspace-apps/leapwell_telemetry
      - ../../repos/frappe_uhis:/workspace-apps/uhis
    environment:
      - SHELL=/bin/bash
    # socket.io looks the user up at the site's own URL (nginx sets it as the Origin): the site name must reach the
    # bench server inside this container.
    extra_hosts:
      - "${SITE_NAME:-lw.localhost}:127.0.0.1"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
      redis-socketio:
        condition: service_started
    networks:
      - leapwell-net

  db:
    # Keep the major version equal to POSTGRES_MAJOR in docker/backend-v16/Dockerfile: `bench backup` runs the
    # backend's pg_dump, which refuses a newer server.
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in env/frappe/.env (copy .env.example)}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - leapwell-net

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - leapwell-net

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - leapwell-net

  redis-socketio:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - leapwell-net

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${FRAPPE_HTTP_PORT:-8082}:8080"
    volumes:
      - ./nginx/frappe.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - SITE_NAME=${SITE_NAME:-lw.localhost}
      - NGINX_ENVSUBST_FILTER=SITE_NAME
    depends_on:
      - backend
    networks:
      - leapwell-net

networks:
  leapwell-net:
    driver: bridge

volumes:
  db-data:

# Data layout:
#   ./development/workspace (gitignored) -> frappe-bench lives here; editable on the host
#   docker volume db-data                -> PostgreSQL data
